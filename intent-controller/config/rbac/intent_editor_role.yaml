# This rule is not used by the project intent-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the agents.gke.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: intent-controller
    app.kubernetes.io/managed-by: kustomize
  name: intent-editor-role
rules:
- apiGroups:
  - agents.gke.io
  resources:
  - intents
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - agents.gke.io
  resources:
  - intents/status
  verbs:
  - get
